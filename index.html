  /* Si la página ya muestra un dónut (Transport, Retrogames, concert-safe-guard…)
     se hace pulsable ESE, en vez de añadir un segundo flotando. */
  function findExisting() {
    var sel = ['img[src*="donut" i]', 'img[src*="dOnuT"]', 'img[alt*="donut" i]',
               'img[class*="donut" i]', '#logo-donut'];
    for (var i = 0; i < sel.length; i++) {
      var el = document.querySelector(sel[i]);
      if (el) return el;
    }
    return null;
  }

  var badge = document.createElement('button');
  badge.id = 'dnt-badge';
  badge.type = 'button';
  badge.title = 'mr_d0nuT';
  badge.setAttribute('aria-label', 'Acerca de mr_d0nuT');
  badge.innerHTML = '<img src="' + IMG + '" alt="">';

  var modal = document.createElement('div');
  modal.id = 'dnt-about';
  modal.innerHTML =
    '<div id="dnt-card" role="dialog" aria-modal="true" aria-label="Acerca de mr_d0nuT">' +
      '<button id="dnt-x" type="button" aria-label="Cerrar">&#10005;</button>' +
      '<img src="' + IMG + '" alt="">' +
      '<b>&copy;mr_d0nuT</b>' +

        '<a class="dnt-mail" href="mailto:mr_donut@hotmail.com">mr_donut@hotmail.com</a><br>' +
        '<a class="dnt-mail" href="mailto:donut.gub@gmail.com">donut.gub@gmail.com</a>' +
      '</div>' +
    '</div>';

  function show(on) { modal.classList.toggle('dnt-on', !!on); }

  function mount() {
    document.head.appendChild(css);
    document.body.appendChild(modal);
    var existing = findExisting();
    if (existing) {
      existing.style.cursor = 'pointer';
      existing.title = 'mr_d0nuT';
      existing.addEventListener('click', function () { show(true); });
    } else {
      document.body.appendChild(badge);
      badge.addEventListener('click', function () { show(true); });
    }
    modal.addEventListener('click', function (e) {
      if (!e.target.closest('#dnt-card') || e.target.id === 'dnt-x') show(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') show(false);
    });
  }
  if (document.body) mount();
  else document.addEventListener('DOMContentLoaded', mount);
})();
